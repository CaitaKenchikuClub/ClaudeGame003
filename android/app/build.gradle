apply plugin: 'com.android.application'

// AdMob app IDs (docs/ADS.md). debug builds always use Google's sample app ID and test ads;
// only release builds (the one uploaded to Google Play) use the production ID.
def ADMOB_APP_ID_TEST = 'ca-app-pub-3940256099942544~3347511713'
def ADMOB_APP_ID_PRODUCTION = 'ca-app-pub-9985841758256257~9542081505'

// Release signing (docs/ANDROID.md 6章). The upload key stays outside the repo (android/keystore.properties says where);
// its password is read from the macOS Keychain, and only when a release build is requested.
def signingProps = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
def wantsRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

android {
    namespace = "com.caitakenchikuclub.burokocho"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.caitakenchikuclub.burokocho"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [admobAppId: ADMOB_APP_ID_TEST]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (signingProps.storeFile) {
                storeFile file(signingProps.storeFile.replaceFirst('^~', System.getProperty('user.home')))
                keyAlias signingProps.keyAlias
                if (wantsRelease) {
                    def pw = ['security', 'find-generic-password', '-a', System.getProperty('user.name'), '-s', signingProps.keychainService, '-w'].execute().text.trim()
                    if (!pw) throw new GradleException("署名のパスワードがキーチェーンにありません（docs/ANDROID.md 6章）: ${signingProps.keychainService}")
                    storePassword pw
                    keyPassword pw
                }
            }
        }
    }
    buildTypes {
        release {
            if (signingProps.storeFile) signingConfig signingConfigs.release
            manifestPlaceholders = [admobAppId: ADMOB_APP_ID_PRODUCTION ?: ADMOB_APP_ID_TEST]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
